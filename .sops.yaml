# Encrypt *.enc.env to the same SSH-key recipients the org uses elsewhere, so
# holders of the matching SSH private keys can decrypt with `sops -d` /
# `sops exec-env`. Rotate these creds and recipients as needed.
creation_rules:
  - path_regex: \.enc\.env$
    age: >-
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDnTMNeoxB4M0vwsbC02XXQop9iz8vHD+/L5lNqqmuCO,

      ssh-rsa 
