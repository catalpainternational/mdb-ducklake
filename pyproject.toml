[project]
name = "mdb-ducklake"
version = "0.0.1"
description = "Sync an MS Access database into an updatable DuckLake mirror"
authors = [{ name = "Josh Brooks", email = "josh@catalpa.io" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.3.0",
    "pytz",  # DuckDB needs it to convert DuckLake's TIMESTAMPTZ snapshot columns
]

[project.optional-dependencies]
# Needed only to ingest a real .accdb (pulls mdbtools' Python wrapper).
# The DuckLake sync mechanics themselves need only duckdb.
access = ["mdb-codegen>=0.1.11"]

[project.scripts]
mdb-ducklake = "mdb_ducklake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
